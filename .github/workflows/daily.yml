name: Daily Job Agent

on:
  schedule:
    # Runs at 05:00 UTC daily ≈ 06:00 (winter) / 07:00 (summer) German time.
    # Cron in GitHub Actions is always UTC. Adjust the hour if you like.
    - cron: "0 5 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write         # needed to commit seen.json back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history, so the rebase below has a merge base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Scoring model. scoring.py defaults to gpt-5.6-luna; uncomment to
          # override, e.g. gpt-5.6-terra for sharper but pricier judgement.
          # OPENAI_MODEL: gpt-5.6-terra
          # CV injected at runtime so it never gets committed. Without it the
          # run fails fast instead of scoring against the cv.txt placeholder.
          CV_TEXT: ${{ secrets.CV_TEXT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional email channel. Leave these secrets unset to skip email.
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py

      - name: Persist seen jobs
        run: |
          git config user.name "job-agent"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          if git diff --staged --quiet; then
            echo "seen.json unchanged, nothing to persist."
            exit 0
          fi
          git commit -m "update seen jobs [skip ci]"
          # main can move under us (you push while a run is in flight, or this
          # is a re-run replaying an older SHA), so rebase onto the remote tip
          # and retry instead of failing the whole run on a rejected push.
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "seen.json persisted on attempt ${attempt}."
              exit 0
            fi
            echo "push attempt ${attempt} failed; retrying in 5s..."
            sleep 5
          done
          echo "could not persist seen.json after 3 attempts" >&2
          exit 1
